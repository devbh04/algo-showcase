<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ema-bg-clean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#0c1224"/>
    </linearGradient>

    <!-- Candlestick Fills -->
    <linearGradient id="eg-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="eg-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Moving Average Glows -->
    <filter id="cyan-glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="ema-grid-clean" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="540" fill="url(#ema-bg-clean)"/>
  <rect width="1200" height="540" fill="url(#ema-grid-clean)"/>

  <!-- Minimal Header / Meta Info -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
      DUAL 9/15 EMA INTRADAY ENGINE
    </text>
    <text x="0" y="18" fill="#64748b" font-family="monospace" font-size="11">
      5-Min EMA Pullback &amp; Wick Rejection • Black-Scholes Options Overlay
    </text>
  </g>

  <!-- Right Header Tags -->
  <g transform="translate(1140, 42)" text-anchor="end">
    <text x="0" y="0" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="700">
      SHOONYA WS TICK FEED &lt; 25MS
    </text>
    <text x="0" y="18" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">
      ATM OPTIONS ROUTE (Δ 0.52 • MUTEX LOCK)
    </text>
  </g>

  <!-- Horizontal Price Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="60" y1="120" x2="1140" y2="120"/>
    <line x1="60" y1="200" x2="1140" y2="200"/>
    <line x1="60" y1="280" x2="1140" y2="280"/>
    <line x1="60" y1="360" x2="1140" y2="360"/>
    <line x1="60" y1="440" x2="1140" y2="440"/>
  </g>

  <!-- ── DUAL MOVING AVERAGE CURVES (9 EMA & 15 EMA) ────────────────── -->
  <!-- Slow 15 EMA (Royal Blue Curve) -->
  <path d="M 60 440 
           C 240 420, 400 370, 560 310 
           C 720 250, 920 180, 1140 140" 
        fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.8"/>
  <text x="1060" y="130" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="700">
    15 EMA
  </text>

  <!-- Fast 9 EMA (Bright Cyan Curve) -->
  <path d="M 60 410 
           C 240 385, 400 330, 560 270 
           C 720 210, 920 140, 1140 100" 
        fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#cyan-glow-subtle)"/>
  <text x="1060" y="90" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700">
    9 EMA
  </text>

  <!-- ── KEY TRADING LEVELS ─────────────────────────────────────────── -->
  <!-- Target Line (1:2.0 RR) -->
  <line x1="680" y1="150" x2="1140" y2="150" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  <rect x="1000" y="138" width="140" height="24" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
  <text x="1070" y="154" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">
    TARGET: 1:2.0 RR
  </text>

  <!-- Breakout Entry Line -->
  <line x1="560" y1="280" x2="900" y2="280" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="720" y="272" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700">
    Breakout Entry (Gap ≤ 0.50 pts)
  </text>

  <!-- Trailing Stop Milestone -->
  <line x1="680" y1="220" x2="980" y2="220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="820" y="212" fill="#d97706" font-family="monospace" font-size="9.5" font-weight="600">
    Trail SL: Lock +0.5R
  </text>

  <!-- ── 5-MIN CANDLESTICKS SEQUENCE (SPACIOUS & ELEGANT) ───────────── -->
  <!-- Candle 1: Initial Bullish Push -->
  <line x1="150" y1="365" x2="150" y2="435" stroke="#10b981" stroke-width="2"/>
  <rect x="138" y="380" width="24" height="40" fill="url(#eg-green)" rx="2"/>

  <!-- Candle 2: Bullish Continuation -->
  <line x1="240" y1="320" x2="240" y2="395" stroke="#10b981" stroke-width="2"/>
  <rect x="228" y="335" width="24" height="45" fill="url(#eg-green)" rx="2"/>

  <!-- Candle 3: Uptrend Momentum High -->
  <line x1="330" y1="280" x2="330" y2="360" stroke="#10b981" stroke-width="2"/>
  <rect x="318" y="295" width="24" height="50" fill="url(#eg-green)" rx="2"/>

  <!-- Candle 4: Red Pullback Candle (Dropping into EMA band) -->
  <line x1="420" y1="290" x2="420" y2="360" stroke="#f43f5e" stroke-width="2"/>
  <rect x="408" y="300" width="24" height="45" fill="url(#eg-red)" rx="2"/>
  <text x="420" y="380" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">
    Pullback
  </text>

  <!-- Candle 5: THE SIGNAL CANDLE (HAMMER WITH LOWER-WICK REJECTION TOUCHING 9 EMA) -->
  <!-- Upper wick (minimal) -->
  <line x1="520" y1="275" x2="520" y2="280" stroke="#10b981" stroke-width="2"/>
  <!-- Small green body -->
  <rect x="507" y="280" width="26" height="22" fill="url(#eg-green)" stroke="#6ee7b7" stroke-width="1" rx="2"/>
  <!-- Long lower wick dipping down to touch the 9 EMA at Y=335 -->
  <line x1="520" y1="302" x2="520" y2="345" stroke="#10b981" stroke-width="2.5"/>

  <!-- 9 EMA Touch Indicator Point -->
  <circle cx="520" cy="335" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Subtle Annotation for Signal Candle -->
  <g transform="translate(520, 240)" text-anchor="middle">
    <text x="0" y="0" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="800">
      9 EMA Touch &amp; Rejection
    </text>
    <text x="0" y="13" fill="#67e8f9" font-family="monospace" font-size="9" opacity="0.8">
      Lower Wick Absorption
    </text>
  </g>

  <!-- Candle 6: BREAKOUT ENTRY CANDLE -->
  <line x1="620" y1="240" x2="620" y2="315" stroke="#10b981" stroke-width="2.5"/>
  <rect x="607" y="250" width="26" height="50" fill="url(#eg-green)" stroke="#6ee7b7" stroke-width="1" rx="2"/>
  <text x="620" y="335" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">
    Long Entry
  </text>

  <!-- Candle 7: Expansion Candle -->
  <line x1="720" y1="185" x2="720" y2="270" stroke="#10b981" stroke-width="2.5"/>
  <rect x="707" y="200" width="26" height="55" fill="url(#eg-green)" rx="2"/>

  <!-- Candle 8: Momentum Surge Reaching Target -->
  <line x1="820" y1="135" x2="820" y2="225" stroke="#10b981" stroke-width="2.5"/>
  <rect x="807" y="148" width="26" height="60" fill="url(#eg-green)" stroke="#6ee7b7" stroke-width="1" rx="2"/>
  <text x="820" y="125" fill="#34d399" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">
    Target Hit (1:2.0)
  </text>

  <!-- Candle 9: Consolidation at Target -->
  <line x1="920" y1="140" x2="920" y2="200" stroke="#10b981" stroke-width="2"/>
  <rect x="908" y="150" width="24" height="35" fill="url(#eg-green)" rx="2"/>

  <!-- Options Route Minimal Pill Badge (Placed cleanly in top-center) -->
  <g transform="translate(680, 75)">
    <rect width="260" height="26" rx="13" fill="#11192e" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#3b82f6"/>
    <text x="26" y="17" fill="#bfdbfe" font-family="monospace" font-size="10" font-weight="700">
      OPTION ROUTE: NIFTY ATM CALL (Δ 0.52)
    </text>
  </g>
</svg>
