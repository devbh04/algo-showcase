<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="mr-bg-clean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>

    <!-- Candlestick Fills -->
    <linearGradient id="c-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Faint Background Grid Pattern -->
    <pattern id="clean-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="540" fill="url(#mr-bg-clean)"/>
  <rect width="1200" height="540" fill="url(#clean-grid)"/>

  <!-- Minimal Header / Meta Info -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
      NSE F&amp;O INTRADAY MEAN REVERSION
    </text>
    <text x="0" y="18" fill="#64748b" font-family="monospace" font-size="11">
      Statistical Overextension Screen → Counter-Trend 09:15 Open Reversal
    </text>
  </g>

  <!-- Right Header Tags -->
  <g transform="translate(1140, 42)" text-anchor="end">
    <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">
      UNIVERSE: 100+ F&amp;O LIQUID
    </text>
    <text x="0" y="18" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">
      ASYMMETRIC 2:1 RR (+4.0% / -2.0%)
    </text>
  </g>

  <!-- Horizontal Price Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="60" y1="120" x2="1140" y2="120"/>
    <line x1="60" y1="200" x2="1140" y2="200"/>
    <line x1="60" y1="280" x2="1140" y2="280"/>
    <line x1="60" y1="360" x2="1140" y2="360"/>
    <line x1="60" y1="440" x2="1140" y2="440"/>
  </g>

  <!-- ── 200 SMA SECULAR BULL BASELINE (GOLDEN CURVE) ──────────────── -->
  <path d="M 60 420 C 260 410, 480 390, 720 360 C 920 335, 1050 310, 1140 295" 
        fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85"/>
  
  <!-- 200 SMA Subtle Text Tag -->
  <text x="140" y="405" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" opacity="0.9">
    200 SMA (Close &gt; 200 SMA Secular Bull Filter)
  </text>

  <!-- ── KEY TRADING LEVELS (THIN, CLEAN LINES WITH RIGHT-AXIS BADGES) ─ -->
  <!-- Stop Loss Line (-2.0%) -->
  <line x1="720" y1="120" x2="1140" y2="120" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
  <rect x="1040" y="108" width="100" height="24" rx="4" fill="#290814" stroke="#f43f5e" stroke-width="1"/>
  <text x="1090" y="124" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">
    SL: -2.0%
  </text>

  <!-- Entry Line (09:15 Short Entry) -->
  <line x1="720" y1="168" x2="1140" y2="168" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
  <rect x="1010" y="156" width="130" height="24" rx="4" fill="#e11d48"/>
  <text x="1075" y="172" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">
    SHORT @ 09:15
  </text>

  <!-- Target Line (+4.0% Reversion) -->
  <line x1="720" y1="360" x2="1140" y2="360" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  <rect x="1020" y="348" width="120" height="24" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
  <text x="1080" y="364" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">
    TARGET: +4.0%
  </text>

  <!-- ── CANDLESTICKS (CLEAN, WIDE SPACING, VOLUMETRIC BODIES) ──────── -->
  <!-- Candle 1: Baseline Green -->
  <line x1="180" y1="330" x2="180" y2="395" stroke="#10b981" stroke-width="2"/>
  <rect x="168" y="345" width="24" height="35" fill="url(#c-green)" rx="2"/>

  <!-- Candle 2: Normal Red Consolidation -->
  <line x1="270" y1="335" x2="270" y2="390" stroke="#f43f5e" stroke-width="2"/>
  <rect x="258" y="345" width="24" height="30" fill="url(#c-red)" rx="2"/>

  <!-- Candle 3: Normal Green Step -->
  <line x1="360" y1="305" x2="360" y2="375" stroke="#10b981" stroke-width="2"/>
  <rect x="348" y="320" width="24" height="40" fill="url(#c-green)" rx="2"/>

  <!-- Candle 4: Day -2 Baseline Day -->
  <line x1="450" y1="285" x2="450" y2="365" stroke="#10b981" stroke-width="2"/>
  <rect x="438" y="300" width="24" height="45" fill="url(#c-green)" rx="2"/>
  <text x="450" y="385" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Day -2</text>

  <!-- Candle 5: Day -1 THE IMPULSE DAY (+3%+ GREEN SURGE) -->
  <line x1="570" y1="135" x2="570" y2="310" stroke="#10b981" stroke-width="2.5"/>
  <rect x="556" y="150" width="28" height="135" fill="url(#c-green)" stroke="#6ee7b7" stroke-width="1" rx="3"/>
  <text x="570" y="385" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Day -1 (Surge)</text>

  <!-- Subtle Label Above Impulse Surge -->
  <g transform="translate(570, 115)" text-anchor="middle">
    <text x="0" y="0" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="800">
      +4.2% Impulse Spike
    </text>
    <text x="0" y="12" fill="#6ee7b7" font-family="monospace" font-size="9" opacity="0.8">
      Close &gt; 1.03 × Close[-2] • RSI(2) &gt; 80
    </text>
  </g>

  <!-- Candle 6: Day 0 THE MEAN REVERSION (RED CANDLE DOWNWARDS FROM OPEN) -->
  <line x1="720" y1="155" x2="720" y2="365" stroke="#f43f5e" stroke-width="2.5"/>
  <rect x="706" y="168" width="28" height="175" fill="url(#c-red)" stroke="#fca5a5" stroke-width="1" rx="3"/>
  <text x="720" y="385" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">Day 0 (Short)</text>

  <!-- Clean Minimalist Reversion Arrow -->
  <path d="M 755 200 C 785 240, 790 280, 780 320" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="775,325 785,317 778,312" fill="#38bdf8"/>
  <text x="800" y="265" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">
    Mean Reversion ▼
  </text>

  <!-- Candle 7: Follow-through Green Exit at Target -->
  <line x1="860" y1="340" x2="860" y2="400" stroke="#10b981" stroke-width="2"/>
  <rect x="848" y="350" width="24" height="30" fill="url(#c-green)" rx="2"/>
  <text x="860" y="405" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">EOD Close (15:20)</text>

</svg>
